[package]
name = "codex-relay"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Self-hosted OpenAI-compatible gateway backed by a ChatGPT/Codex subscription"
repository = "https://github.com/e16tae/codex-relay"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
